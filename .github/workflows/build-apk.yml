name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Debug
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Aceptar licencias del SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Preparar variables de entorno y keystore
        run: |
          # Asegurar existencia de archivo .env
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch .env

          # Generar keystore de depuración requerido por build.gradle.kts
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherPay-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
