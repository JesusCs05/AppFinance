name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Debug
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Aceptar licencias del SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Preparar variables de entorno y keystore
        run: |
          # Asegurar existencia de archivo .env a partir de .env.example
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch .env

          # Asegurar existencia de google-services.json
          if [ ! -f app/google-services.json ]; then
            echo "Restaurando app/google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "686838452337",
    "project_id": "gen-lang-client-0002612712",
    "storage_bucket": "gen-lang-client-0002612712.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:686838452337:android:42d3fd8f573f54470bcbd0",
        "android_client_info": {
          "package_name": "com.aistudio.aetherpay.vxrkpm"
        }
      },
      "oauth_client": [
        {
          "client_id": "686838452337-v2m3qeqod6l87npgvcpbk8jm463c76j7.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.aetherpay.vxrkpm",
            "certificate_hash": "0762c70b365773a3cc6c923e999671bae9ec8665"
          }
        },
        {
          "client_id": "686838452337-neevd4k4tccpiborbvi6g11dta53eg63.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyBgS1BD5lvVt1GCpHKj-t8eohNUXyqmwmM"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "686838452337-neevd4k4tccpiborbvi6g11dta53eg63.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          # Generar keystore de depuración requerido por build.gradle.kts
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew || true

      - name: Compilar APK (assembleDebug)
        run: |
          if command -v gradle &> /dev/null; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Subir APK como artefacto descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherPay-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
